<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Den Ideal – Sociale Onderneming</title>
  <style>
    :root {
      --navy: #1a3a6b;
      --navy-dark: #0f2347;
      --navy-light: #2a4f8f;
      --gold: #e8a820;
      --gold-light: #f5c842;
      --radius: 12px;
      --off-white: #f4f6fb;
      --muted: #6b7a99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f6fb; }
    .site { max-width: 900px; margin: 0 auto; padding-bottom: 40px; }

    /* ── NAV ── */
    .nav {
      background: var(--navy-dark);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 60px;
      border-radius: 0 0 12px 12px;
    }
    .nav-left  { display: flex; align-items: center; gap: 10px; }
    .nav-logo-circle {
      width: 40px; height: 40px; background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .nav-brand { font-size: 15px; color: white; font-weight: 500; }
    .nav-right { display: flex; align-items: center; gap: 6px; }
    .nav-tab {
      background: none; border: none;
      color: rgba(255,255,255,0.65); font-size: 13px;
      padding: 6px 13px; border-radius: 6px; cursor: pointer;
      transition: all .15s;
    }
    .nav-tab:hover  { color: white; background: rgba(255,255,255,0.08); }
    .nav-tab.active { color: white; background: rgba(232,168,32,0.22); border: 0.5px solid rgba(232,168,32,0.4); }
    .lang-sep { width: 0.5px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 2px; }

    /* language toggle */
    .lang-toggle {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 7px; padding: 4px 10px; cursor: pointer;
      color: white; font-size: 13px; font-weight: 500;
      position: relative; user-select: none;
    }
    .lang-toggle:hover { background: rgba(255,255,255,0.14); }
    .lang-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--navy-dark); border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 8px; overflow: hidden; z-index: 100; min-width: 90px;
    }
    .lang-dropdown.open { display: block; }
    .lang-opt {
      display: block; width: 100%; background: none; border: none;
      color: rgba(255,255,255,0.75); font-size: 13px;
      padding: 7px 14px; cursor: pointer; text-align: left;
    }
    .lang-opt:hover  { background: rgba(255,255,255,0.08); color: white; }
    .lang-opt.active { color: var(--gold-light); }

    /* ── PAGES ── */
    .page { display: none; animation: fi .25s ease; }
    .page.active { display: block; }
    @keyframes fi { from { opacity:0; transform:translateY(5px); } to { opacity:1; } }

    /* ── ABOUT ── */
    .about-hero {
      background: var(--navy); border-radius: 12px;
      margin: 14px 0; padding: 44px 36px;
      display: flex; align-items: center; gap: 36px;
      position: relative; overflow: hidden;
    }
    .about-hero::before {
      content: ''; position: absolute; right: -50px; top: -50px;
      width: 230px; height: 230px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .hero-logo {
      width: 118px; height: 118px; background: white; border-radius: 50%;
      flex-shrink: 0; border: 3px solid rgba(232,168,32,0.45);
      z-index: 1; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .about-text { z-index: 1; }
    .about-text h1 { font-size: 28px; font-weight: 500; color: white; margin-bottom: 8px; }
    .tag {
      display: inline-block; background: rgba(232,168,32,0.18);
      border: 0.5px solid rgba(232,168,32,0.45); color: var(--gold-light);
      font-size: 11px; padding: 3px 10px; border-radius: 20px;
      letter-spacing: .05em; margin-bottom: 10px; text-transform: uppercase;
    }
    .about-text p { color: rgba(255,255,255,0.76); font-size: 14px; line-height: 1.65; max-width: 420px; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .card { background: white; border-radius: 12px; padding: 22px; border: 0.5px solid #dde3f0; }
    .card-icon {
      width: 36px; height: 36px; background: #f4f6fb; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
    }
    .card h3 { font-size: 15px; font-weight: 500; color: #0f2347; margin-bottom: 7px; }
    .card p  { font-size: 13px; color: #6b7a99; line-height: 1.6; }

    .banner {
      background: var(--gold); border-radius: 12px; padding: 18px 26px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .banner-main { font-size: 20px; font-weight: 500; color: var(--navy-dark); }
    .banner small { font-size: 12px; color: rgba(15,35,71,0.7); display: block; margin-top: 2px; }

    /* ── SERVICES ── */
    .section-head { padding: 28px 0 6px; text-align: center; }
    .section-head h1 { font-size: 26px; font-weight: 500; color: #0f2347; }
    .section-head p  { color: #6b7a99; font-size: 14px; margin-top: 5px; }
    .divider { width: 44px; height: 3px; background: var(--gold); border-radius: 2px; margin: 10px auto 24px; }

    .svc-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
    .svc-card { background: white; border-radius: 12px; border: 0.5px solid #dde3f0; overflow: hidden; display: flex; }
    .svc-accent { width: 7px; flex-shrink: 0; }
    .acc-navy { background: var(--navy); }
    .acc-gold { background: var(--gold); }
    .acc-teal { background: #1a8c6e; }
    .svc-icon { width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #f4f6fb; }
    .svc-body { padding: 20px 22px; flex: 1; }
    .svc-body h2 { font-size: 17px; font-weight: 500; color: #0f2347; margin-bottom: 5px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .badge { font-size: 11px; font-weight: 400; padding: 2px 8px; border-radius: 20px; }
    .b-blue { background: #e6edf8; color: var(--navy); }
    .b-gold { background: #fef3d8; color: #7a5200; }
    .b-teal { background: #e0f5ee; color: #0a5c42; }
    .svc-body p { font-size: 13px; color: #6b7a99; line-height: 1.6; margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { background: #f4f6fb; border: 0.5px solid #dde3f0; border-radius: 20px; font-size: 12px; color: var(--navy); padding: 3px 9px; }

    /* ── CONTACT ── */
    .contact-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; margin-bottom: 18px; }
    .contact-info { display: flex; flex-direction: column; gap: 11px; }
    .info-card { background: var(--navy); border-radius: 12px; padding: 20px; }
    .info-card h3 { font-size: 15px; font-weight: 500; color: var(--gold-light); margin-bottom: 14px; }
    .info-row { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 11px; }
    .info-ic {
      width: 27px; height: 27px; background: rgba(255,255,255,0.1);
      border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .info-txt { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.5; }
    .info-txt strong { color: white; font-size: 11px; display: block; margin-bottom: 2px; letter-spacing: .04em; text-transform: uppercase; }
    .soc-row { display: flex; gap: 7px; margin-top: 4px; }
    .soc-btn {
      background: rgba(255,255,255,0.1); border: 0.5px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.78); font-size: 12px; padding: 5px 11px; border-radius: 6px; cursor: pointer;
    }
    .map-stub {
      background: #e6edf8; border-radius: 12px; border: 0.5px solid #c5d3ea;
      padding: 16px; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 5px; min-height: 86px;
    }
    .map-stub p     { font-size: 13px; color: var(--navy); font-weight: 500; }
    .map-stub small { font-size: 12px; color: #6b7a99; }

    .cf { background: white; border-radius: 12px; padding: 26px; border: 0.5px solid #dde3f0; }
    .cf h3 { font-size: 16px; font-weight: 500; color: #0f2347; margin-bottom: 16px; }
    .fr { margin-bottom: 13px; }
    .fr label { font-size: 11px; color: #6b7a99; display: block; margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
    .fr input, .fr textarea, .fr select {
      width: 100%; background: #f4f6fb; border: 0.5px solid #dde3f0;
      border-radius: 8px; padding: 8px 11px; font-size: 13px; color: #0f2347;
      font-family: inherit; outline: none;
    }
    .fr textarea { height: 76px; resize: none; }
    .fr2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .sub-btn {
      width: 100%; background: var(--navy); color: white; border: none;
      border-radius: 8px; padding: 10px; font-size: 14px; cursor: pointer;
      margin-top: 3px; font-family: inherit;
    }
    .sub-btn:hover { background: var(--navy-light); }
    .form-alert {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      background: #fff4e5;
      color: #7a4f08;
      border: 1px solid #ffddb3;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     PAGE LAYOUT
═══════════════════════════════════════════ -->
<div class="site">

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo-circle" id="nav-logo"></div>
      <span class="nav-brand">Den Ideal</span>
    </div>
    <div class="nav-right">
      <button class="nav-tab active" onclick="showPage('about',this)"    id="tab-about"></button>
      <button class="nav-tab"        onclick="showPage('services',this)" id="tab-services"></button>
      <button class="nav-tab"        onclick="showPage('contact',this)"  id="tab-contact"></button>
      <div class="lang-sep"></div>
      <div class="lang-toggle" id="lang-toggle" onclick="toggleDropdown()">
        <svg width="14" height="14" stroke="white"><use href="#ic-globe"/></svg>
        <span id="lang-label">NL</span>
        <div class="lang-dropdown" id="lang-dropdown">
          <button class="lang-opt"        onclick="setLang('en',this,event)">EN — English</button>
          <button class="lang-opt active" onclick="setLang('nl',this,event)">NL — Nederlands</button>
          <button class="lang-opt"        onclick="setLang('fr',this,event)">FR — Francais</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── ABOUT PAGE ── -->
  <div class="page active" id="page-about">
    <div class="about-hero">
      <div class="hero-logo" id="hero-logo"></div>
      <div class="about-text">
        <div class="tag" id="hero-tag"></div>
        <h1 id="hero-title"></h1>
        <p  id="hero-desc"></p>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-icon"><svg width="18" height="18" stroke="#1a3a6b" fill="none"><use href="#ic-target"/></svg></div>
        <h3 id="c1t"></h3><p id="c1d"></p>
      </div>
      <div class="card">
        <div class="card-icon"><svg width="18" height="18" stroke="#1a3a6b" fill="none"><use href="#ic-handshake"/></svg></div>
        <h3 id="c2t"></h3><p id="c2d"></p>
      </div>
      <div class="card">
        <div class="card-icon"><svg width="18" height="18" stroke="#1a3a6b" fill="none"><use href="#ic-users"/></svg></div>
        <h3 id="c3t"></h3><p id="c3d"></p>
      </div>
      <div class="card">
        <div class="card-icon"><svg width="18" height="18" stroke="#1a3a6b" fill="none"><use href="#ic-chart"/></svg></div>
        <h3 id="c4t"></h3><p id="c4d"></p>
      </div>
    </div>
    <div class="banner">
      <div>
        <div class="banner-main">BE 1033.159.767</div>
        <small id="banner-sub"></small>
      </div>
      <div style="text-align:right">
        <div style="font-size:14px;color:#0f2347;font-weight:500;">www.denideal.be</div>
        <small>Potterijstraat 5, Mechelen</small>
      </div>
    </div>
  </div>

  <!-- ── SERVICES PAGE ── -->

    <div class="section-head">
      <h1 id="svc-title"></h1>
      <p  id="svc-sub"></p>
      <div class="divider"></div>
    </div>
    <div class="svc-list">
      <!-- Laptop & IT -->
      <div class="svc-card">
        <div class="svc-accent acc-navy"></div>
        <div class="svc-icon">
          <svg width="36" height="36" stroke="#1a3a6b" fill="none" stroke-width="1.5"><use href="#ic-laptop"/></svg>

      <!-- Textile -->

        <div class="svc-accent acc-gold"></div>
        <div class="svc-icon">
          <svg width="36" height="36" stroke="#e8a820" fill="none" stroke-width="1.5"><use href="#ic-textile"/></svg>
        </div>
        <div class="svc-body">
          <h2 id="s2t"></h2>
          <p  id="s2d"></p>
          <div class="chips" id="s2chips"></div>
        </div>
      </div>
      <!-- Events -->

        <div class="svc-accent acc-teal"></div>
        <div class="svc-icon">
          <svg width="36" height="36" stroke="#1a8c6e" fill="none" stroke-width="1.5"><use href="#ic-event"/></svg>
        </div>
        <div class="svc-body">
          <h2 id="s3t"></h2>
          <p  id="s3d"></p>

      </div>

      <h1 id="con-title"></h1>
      <p  id="con-sub"></p>
      <div class="divider"></div>
    </div>
    <div class="contact-layout">
      <div class="contact-info">
        <div class="info-card">
          <h3 id="con-details"></h3>
          <div class="info-row">
            <div class="info-ic"><svg width="14" height="14" stroke="rgba(255,255,255,0.8)" fill="none"><use href="#ic-pin"/></svg></div>
            <div class="info-txt"><strong id="lbl-addr"></strong>Potterijstraat 5,<br>Mechelen, Belgium</div>
          </div>

            <div class="info-ic"><svg width="14" height="14" stroke="rgba(255,255,255,0.8)" fill="none"><use href="#ic-web"/></svg></div>
            <div class="info-txt"><strong id="lbl-web"></strong>www.denideal.be</div>
          </div>

            <div class="info-ic"><svg width="14" height="14" stroke="rgba(255,255,255,0.8)" fill="none"><use href="#ic-building"/></svg></div>
            <div class="info-txt"><strong id="lbl-ent"></strong>BE 1033.159.767</div>
          </div>
          <div class="info-row">
            <div class="info-ic"><svg width="14" height="14" stroke="rgba(255,255,255,0.8)" fill="none"><use href="#ic-linkedin"/></svg></div>
            <div class="info-txt"><strong>LinkedIn</strong>Den ideal</div>
          </div>
          <div class="soc-row">
            <button class="soc-btn">LinkedIn</button>
            <button class="soc-btn" id="btn-email"></button>
          </div>
        </div>
        <div class="map-stub">
          <svg width="22" height="22" stroke="#1a3a6b" fill="none" stroke-width="1.5"><use href="#ic-map"/></svg>
          <p>Potterijstraat 5, Mechelen</p>
          <small id="map-lnk"></small>
        </div>
      </div>

      <form id="contact-form" class="cf">
        <h3 id="form-title"></h3>
        <div class="fr2">
          <div class="fr"><label id="lbl-fn"></label><input id="first-name" type="text" placeholder="Jana"/></div>
          <div class="fr"><label id="lbl-ln"></label><input id="last-name" type="text" placeholder="Peeters"/></div>
        </div>
        <div class="fr"><label id="lbl-em"></label><input id="email" type="email" placeholder="jana@bedrijf.be"/></div>
        <div class="fr"><label id="lbl-top"></label><select id="topic-sel"></select></div>
        <div class="fr"><label id="lbl-msg"></label><textarea id="msg-ph"></textarea></div>
        <button type="submit" class="sub-btn" id="sub-btn"></button>
        <div class="form-alert" id="form-alert" role="alert"></div>
      </form>
    </div>
  </div>

/* ── LANGUAGE SWITCHER ── */
function toggleDropdown() {
  document.getElementById('lang-dropdown').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  if (!document.getElementById('lang-toggle').contains(e.target))
    document.getElementById('lang-dropdown').classList.remove('open');
});
function setLang(lang, btn, e) {
  if (e) e.stopPropagation();
  document.querySelectorAll('.lang-opt').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('lang-label').textContent = lang.toUpperCase();
  document.getElementById('lang-dropdown').classList.remove('open');
  applyLang(lang);
}

/* ── APPLY TRANSLATIONS ── */
function applyLang(lang) {
  var t = T[lang];
  document.getElementById('tab-about').textContent    = t.tabs[0];
  document.getElementById('tab-services').textContent = t.tabs[1];
  document.getElementById('tab-contact').textContent  = t.tabs[2];
  document.getElementById('hero-tag').textContent     = t.heroTag;
  document.getElementById('hero-title').textContent   = t.heroTitle;
  document.getElementById('hero-desc').textContent    = t.heroDesc;
  ['c1t','c2t','c3t','c4t'].forEach(function(id,i) { document.getElementById(id).textContent = t.cards[i][0]; });
  ['c1d','c2d','c3d','c4d'].forEach(function(id,i) { document.getElementById(id).textContent = t.cards[i][1]; });
  document.getElementById('banner-sub').textContent = t.bannerSub;
  document.getElementById('svc-title').textContent  = t.svcTitle;
  document.getElementById('svc-sub').textContent    = t.svcSub;

  function setSvc(idT, idD, idC, title, badge, bClass, desc, chips) {
    var el = document.getElementById(idT);
    el.innerHTML = '';
    el.appendChild(document.createTextNode(title + ' '));
    var b = document.createElement('span');
    b.className = 'badge ' + bClass;
    b.textContent = badge;
    el.appendChild(b);
    document.getElementById(idD).textContent = desc;
    document.getElementById(idC).innerHTML = chips.map(function(c) {
      return '<span class="chip">' + c + '</span>';
    }).join('');
  }
  setSvc('s1t','s1d','s1chips', t.s1t, t.s1badge, 'b-blue', t.s1d, t.s1chips);
  setSvc('s2t','s2d','s2chips', t.s2t, t.s2badge, 'b-gold', t.s2d, t.s2chips);
  setSvc('s3t','s3d','s3chips', t.s3t, t.s3badge, 'b-teal', t.s3d, t.s3chips);

  document.getElementById('con-title').textContent   = t.conTitle;
  document.getElementById('con-sub').textContent     = t.conSub;
  document.getElementById('con-details').textContent = t.conDetails;
  document.getElementById('lbl-addr').textContent    = t.lblAddr;
  document.getElementById('lbl-web').textContent     = t.lblWeb;
  document.getElementById('lbl-ent').textContent     = t.lblEnt;
  document.getElementById('btn-email').textContent   = t.btnEmail;
  document.getElementById('map-lnk').textContent     = t.mapLnk;
  document.getElementById('form-title').textContent  = t.formTitle;
  document.getElementById('lbl-fn').textContent      = t.lblFn;
  document.getElementById('lbl-ln').textContent      = t.lblLn;
  document.getElementById('lbl-em').textContent      = t.lblEm;
  document.getElementById('lbl-top').textContent     = t.lblTop;
  document.getElementById('lbl-msg').textContent     = t.lblMsg;
  document.getElementById('msg-ph').placeholder      = t.msgPh;
  var sel = document.getElementById('topic-sel');
  sel.innerHTML = t.topics.map(function(o) { return '<option>' + o + '</option>'; }).join('');
  document.getElementById('sub-btn').textContent = t.subBtn;
}

/* ── PAGE SWITCHER ── */
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p)   { p.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── LOGO CLONE ── */
function cloneLogo(el, size) {
  var tpl   = document.getElementById('logo-tpl');
  var clone = tpl.content.cloneNode(true);
  var img   = clone.querySelector('img');
  img.style.width  = size + 'px';
  img.style.height = size + 'px';
  el.appendChild(img);
}
cloneLogo(document.getElementById('nav-logo'),  38);
cloneLogo(document.getElementById('hero-logo'), 112);
